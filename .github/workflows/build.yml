name: Сборка APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Установка зависимостей
      - name: Установка зависимостей
        run: npm install
      - name: Android-проект
        run: npx cap add android
      - name: Разрешения (уведомления, геолокация)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n</manifest>#' "$M"
          cat "$M"
      - name: Иконка и заставка
        continue-on-error: true
        run: |
          mkdir -p assets
          if [ ! -f assets/icon-only.png ]; then
            convert -size 1024x1024 xc:'#0F6E5A' -stroke white -strokewidth 80 -fill none -draw "stroke-linecap round stroke-linejoin round polyline 300,530 450,680 740,370" assets/icon-only.png
            convert -size 2732x2732 xc:'#EEF2F0' assets/splash.png
          fi
          npx @capacitor/assets generate --android --iconBackgroundColor "#0F6E5A" --iconBackgroundColorDark "#0F6E5A" --splashBackgroundColor "#EEF2F0" --splashBackgroundColorDark "#0E1513"
      - name: Синхронизация
        run: npx cap sync android
      - name: Сборка APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Копия APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk planerka.apk
      - uses: actions/upload-artifact@v4
        with:
          name: planerka-apk
          path: planerka.apk
      - name: Публикация
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Планёрка — сборка ${{ github.run_number }}
          body: Скачай planerka.apk ниже и установи на телефон.
          files: planerka.apk
          make_latest: true
